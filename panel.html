<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX AI — Panel</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;--fg:#e0e0e0;--fg2:#999;--accent:#fff;--accent2:#ccc;--border:#2a2a2a;--border2:#333;--ok:#4caf50;--bad:#f44336}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Consolas,Monaco,monospace;font-size:13px}
.layout{display:flex;height:100vh}.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}.sidebar-header h1{font-size:14px;letter-spacing:1px;text-transform:uppercase}.sidebar-header .sub{font-size:11px;color:var(--fg2);margin-top:4px}
.nav{padding:8px 0;flex:1}.nav-item{padding:8px 16px;color:var(--fg2);cursor:pointer;font-size:12px}.nav-item.active,.nav-item:hover{background:var(--bg3);color:var(--accent);border-left:2px solid var(--accent)}
.main{flex:1;display:flex;flex-direction:column}.topbar{padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;gap:12px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.dot.g{background:var(--ok);box-shadow:0 0 6px var(--ok)}.dot.r{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.content{flex:1;overflow-y:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden}.card h3{padding:8px 14px;background:var(--bg3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border);font-size:12px}.row:last-child{border:none}.row label{color:var(--fg2)}
.row input[type=range]{flex:1;appearance:none;-webkit-appearance:none;background:transparent;height:16px;cursor:pointer}
.row input[type=range]::-webkit-slider-runnable-track{height:6px;background:#2a2a2a;border-radius:3px}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;margin-top:-2px;border:none}
.row input[type=range]::-moz-range-track{height:6px;background:#2a2a2a;border-radius:3px}
.row input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:none}.row input[type=number],.row select{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:4px;padding:4px 8px;font-family:inherit;font-size:12px;width:90px}
.val{color:var(--accent2);min-width:44px;text-align:right}.btn{background:var(--bg3);border:1px solid var(--border);color:var(--fg);border-radius:4px;padding:8px 16px;font-family:inherit;font-size:12px;cursor:pointer;margin-right:8px}.btn:hover{background:var(--bg4)}.btn.on{border-color:var(--ok);color:var(--ok)}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}.stat{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px 18px}.stat .l{font-size:10px;color:var(--fg2);text-transform:uppercase}.stat .v{font-size:20px;font-weight:600}
</style></head><body><div class="layout">
<div class="sidebar"><div class="sidebar-header"><h1>Apex AI</h1><div class="sub">Apex5k.200 · DML</div></div>
<div class="nav"><div class="nav-item active">Aimbot</div><div class="nav-item" onclick="alert('Single Apex profile for now')">Profiles</div></div></div>
<div class="main"><div class="topbar"><span id="dot" class="dot r"></span><span id="st">stopped</span><input type="hidden" id="game" value="apex"><span style="flex:1"></span>
<button class="btn on" id="bStart" onclick="setRun(true)">START</button><button class="btn" onclick="setRun(false)">STOP</button></div>
<div class="content">
<div class="stats"><div class="stat"><div class="l">FPS</div><div class="v" id="sFps">-</div></div>
<div class="stat"><div class="l">Boxes</div><div class="v" id="sBox">-</div></div>
<div class="stat"><div class="l">Weapon</div><div class="v" id="sWpn">-</div></div><div class="stat"><div class="l">Driver</div><div class="v" id="sDrv">-</div></div></div>
<div class="grid">
<div class="card"><h3>Target</h3>
<div class="row"><label>Bone</label><select id="bone"><option value="0.05">Head 5%</option><option value="0.15">Neck 15%</option><option value="0.28">Chest 28%</option><option value="0.38">Body 38%</option></select></div>
<div class="row"><label>Conf</label><input type="range" id="conf" min="0.2" max="0.8" step="0.05"><span class="val" id="confV"></span></div>
<div class="row"><label>FOV px</label><input type="range" id="fov" min="40" max="200" step="5"><span class="val" id="fovV"></span></div>
<div class="row"><label>Zone px</label><input type="range" id="zone" min="160" max="400" step="20"><span class="val" id="zoneV"></span></div>
<div class="row"><label>Zoom</label><input type="range" id="zoom" min="1" max="3" step="0.25"><span class="val" id="zoomV"></span></div>
<div class="row"><label>Far auto-zoom</label><select id="autoz"><option value="true">Yes</option><option value="false">No</option></select></div>
</div>
<div class="card"><h3>Movement</h3>
<div class="row"><label>Gain</label><input type="range" id="gain" min="0.5" max="3" step="0.1"><span class="val" id="gainV"></span></div>
<div class="row"><label>Speed (0-1)</label><input type="range" id="spd" min="0.2" max="0.8" step="0.05"><span class="val" id="spdV"></span></div>
<div class="row"><label>Smooth EMA</label><input type="range" id="sm" min="0.2" max="1" step="0.05"><span class="val" id="smV"></span></div>
<div class="row"><label>Aim key</label><select id="key"><option value="rmb">Right click</option><option value="x1">X1</option><option value="x2">X2</option><option value="all">All</option></select></div>
</div>
<div class="card"><h3>Recoil</h3>
<div class="row"><label>No-recoil</label><select id="rc_on"><option value="true">On</option><option value="false">Off</option></select></div>
<div class="row"><label>Force X %</label><input type="range" id="rc_x" min="0" max="300" step="5"><span class="val" id="rc_xV"></span></div>
<div class="row"><label>Force Y %</label><input type="range" id="rc_y" min="0" max="300" step="5"><span class="val" id="rc_yV"></span></div>
</div>
<div class="card"><h3>Overlay</h3>
<div class="row"><label>Draw FOV</label><select id="draw_fov"><option value="true">Yes</option><option value="false">No</option></select></div>
<div class="row"><label>Draw ESP</label><select id="draw_esp"><option value="true">Yes</option><option value="false">No</option></select></div>
</div>
<div class="card"><h3>Status</h3><div class="row"><label>Backend</label><span class="val">DML 6700XT</span></div>
<div class="row"><label>Log</label><span class="val" id="log">-</span></div>
</div>
<div class="card"><h3>Model</h3>
<div class="row"><label>File</label><select id="model"></select></div>
</div></div>
</div></div></div></div>
<script>
let C={};
async function load(){C=await(await fetch('/api/config')).json();const ms=await(await fetch('/api/models')).json();const sel=document.getElementById('model');sel.innerHTML='';ms.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p.split('/').pop();if(p===C.model)o.selected=true;sel.appendChild(o);});for(const k in C){const e=document.getElementById(k);if(!e||k==='model')continue;let v=C[k];if(typeof v==='boolean')v=String(v).toLowerCase();e.value=v;const vv=document.getElementById(k+'V');if(vv)vv.textContent=v;}updDot();}
function updDot(){const d=document.getElementById('dot'),s=document.getElementById('st');d.className='dot '+(C.running?'g':'r');s.textContent=C.running?'running':'stopped';}
async function set(k,v){if(k==='draw_fov'||k==='draw_esp'||k==='autoz'||k==='rc_on')v=(v==='true'||v===true);C[k]=v;await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:v})});const e=document.getElementById(k+'V');if(e)e.textContent=v;}
async function setRun(r){await set('running',r);updDot();}
['conf','fov','zone','gain','spd','sm','zoom','rc_x','rc_y'].forEach(k=>{const e=document.getElementById(k);if(e)e.addEventListener('input',ev=>set(k,parseFloat(ev.target.value)));});
['bone','key','draw_fov','draw_esp','autoz','rc_on','model'].forEach(k=>{const e=document.getElementById(k);if(e)e.addEventListener('change',ev=>set(k,ev.target.value));});
setInterval(async()=>{try{const s=await(await fetch('/api/stats')).json();document.getElementById('sFps').textContent=s.fps;document.getElementById('sBox').textContent=s.boxes;document.getElementById('sDrv').textContent=s.driver;if(document.getElementById('sWpn'))document.getElementById('sWpn').textContent=s.weapon||'-';document.getElementById('log').textContent=s.log||'-';}catch(e){}},800);
load();
</script></body></html>
